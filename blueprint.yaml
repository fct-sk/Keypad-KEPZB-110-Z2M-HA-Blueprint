blueprint:
  name: Frient KEPZB-110 — Alarmo via Zigbee2MQTT (PIN + RFID) v4
  description: >-
    Version 4. Connects a Frient KEPZB-110 keypad through Zigbee2MQTT to
    Alarmo. Supports multiple PINs, an explicit RFID allow-list, optional
    mapping of allowed RFID tags to an Alarmo PIN, state synchronization,
    SOS action and entry/exit beeps using Alarmo's actual delay. RFID IDs
    arrive as action_code values beginning with +. Present the tag, then
    press the desired arm/disarm button.
  domain: automation
  homeassistant:
    min_version: 2024.6.0
  input:
    z2m_keypad_path:
      name: MQTT State Topic of your Zigbee2MQTT Keypad
      description: >-
        Exact Zigbee2MQTT topic including case, for example zigbee2mqtt1/Keypad.
      default: zigbee2mqtt1/Keypad
      selector:
        text: {}
    z2m_keypad_path_set:
      name: MQTT Set Topic of your Zigbee2MQTT Keypad
      description: The State Topic with /set appended.
      default: zigbee2mqtt1/Keypad/set
      selector:
        text: {}
    control_panel:
      name: Alarmo Control Panel
      description: Select the Alarmo alarm_control_panel entity, e.g. alarm_control_panel.master.
      selector:
        entity:
          domain: alarm_control_panel
          multiple: false
    pin:
      name: Primary PIN code
      description: >-
        Primary PIN. It must also be configured as a valid user code in Alarmo.
        This keeps compatibility with the previous version of this blueprint.
      default: ""
      selector:
        text: {}
    pin_list:
      name: Additional valid PIN codes
      description: >-
        Optional additional PINs separated by semicolons, e.g. 2345;3456.
        Every PIN must also exist in Alarmo. These are checked here before the
        request is sent to Alarmo so the keypad gets clear rejection feedback.
      default: ""
      selector:
        text:
          multiline: true
    rfid_list:
      name: Allowed RFID tag IDs
      description: >-
        RFID UID allow-list separated by semicolons. Include the leading plus
        sign exactly as Zigbee2MQTT reports it, e.g. +3DD5FCFF;+ACF5678B.
        Present the tag first, then press the desired arm/disarm button.
      default: ""
      selector:
        text:
          multiline: true
    rfid_alarm_code:
      name: Optional Alarmo code for all allowed RFID tags
      description: >-
        Leave blank to pass each RFID UID (such as +3DD5FCFF) to Alarmo as its
        own code; then that UID must also be configured as an Alarmo code.
        Alternatively enter an existing valid Alarmo PIN here to map every
        allow-listed tag to that single Alarmo code. The latter supports many
        tags without creating an alphanumeric Alarmo code for each tag, but
        Alarmo will see them as the same user/code.
      default: ""
      selector:
        text: {}
    action_panic:
      name: Action — SOS
      description: Action to execute when Zigbee2MQTT reports action=emergency.
      default: []
      selector:
        action: {}
    action_arming:
      name: Action — Arming started
      default: []
      selector:
        action: {}
    action_armed_away:
      name: Action — Armed Away
      default: []
      selector:
        action: {}
    action_armed_home:
      name: Action — Armed Home
      default: []
      selector:
        action: {}
    action_armed_night:
      name: Action — Armed Night
      default: []
      selector:
        action: {}
    action_disarmed:
      name: Action — Disarmed
      default: []
      selector:
        action: {}
    action_pending:
      name: Action — Entry delay started
      default: []
      selector:
        action: {}
    action_triggered:
      name: Action — Alarm triggered
      default: []
      selector:
        action: {}

variables:
  alarm_entity: !input control_panel
  pin_input: !input pin
  pin_list_input: !input pin_list
  rfid_list_input: !input rfid_list
  rfid_alarm_code_input: !input rfid_alarm_code

triggers:
  - trigger: mqtt
    topic: !input z2m_keypad_path
    id: keypad_mqtt
  - trigger: state
    entity_id: !input control_panel
    to: arming
    id: panel_arming
  - trigger: state
    entity_id: !input control_panel
    to: armed_away
    id: panel_armed_away
  - trigger: state
    entity_id: !input control_panel
    to: armed_home
    id: panel_armed_home
  - trigger: state
    entity_id: !input control_panel
    to: armed_night
    id: panel_armed_night
  - trigger: state
    entity_id: !input control_panel
    to: disarmed
    id: panel_disarmed
  - trigger: state
    entity_id: !input control_panel
    to: pending
    id: panel_pending
  - trigger: state
    entity_id: !input control_panel
    to: triggered
    id: panel_triggered

conditions: []

actions:
  - choose:
      # Keypad -> Alarmo
      - conditions:
          - condition: trigger
            id: keypad_mqtt
          - condition: template
            value_template: >-
              {{ trigger.payload_json is defined
                 and trigger.payload_json.get('action', '') == 'emergency' }}
        sequence:
          - choose:
              default: !input action_panic

      - conditions:
          - condition: trigger
            id: keypad_mqtt
          - condition: template
            value_template: >-
              {{ trigger.payload_json is defined
                 and trigger.payload_json.get('action', '') in
                    ['arm_all_zones', 'arm_day_zones', 'arm_night_zones', 'disarm']
                 and trigger.payload_json.get('action_transaction') is not none }}
        sequence:
          - variables:
              keypad_action: "{{ trigger.payload_json.get('action', '') | string }}"
              keypad_code_allowed: >-
                {%- set entered = trigger.payload_json.get('action_code', '') | default('', true) | string -%}
                {%- set single_pin = pin_input | string | trim -%}
                {%- set extra_pins = (pin_list_input | string).split(';') | map('trim') | reject('equalto', '') | list -%}
                {%- set pins = ([single_pin] if single_pin != '' else []) + extra_pins -%}
                {%- set tags = (rfid_list_input | string).split(';') | map('trim') | reject('equalto', '') | list -%}
                {%- if entered.startswith('+') -%}
                  {{ entered in tags }}
                {%- else -%}
                  {{ entered != '' and entered in pins }}
                {%- endif -%}
              alarm_code_to_use: >-
                {%- set entered = trigger.payload_json.get('action_code', '') | default('', true) | string -%}
                {%- if entered.startswith('+') and (rfid_alarm_code_input | string | trim) != '' -%}
                  {{ rfid_alarm_code_input | string | trim }}
                {%- else -%}
                  {{ entered }}
                {%- endif -%}

          - choose:
              # Reject an unknown PIN or an RFID tag which is not allow-listed.
              - conditions:
                  - condition: template
                    value_template: "{{ not (keypad_code_allowed | bool) }}"
                sequence:
                  - action: mqtt.publish
                    data:
                      topic: !input z2m_keypad_path_set
                      qos: 0
                      retain: false
                      payload: >-
                        {{ {'arm_mode': {'transaction': trigger.payload_json.get('action_transaction'), 'mode': 'invalid_code'}} | tojson }}

              # Valid PIN/tag: acknowledge the keypad transaction, then ask Alarmo.
              - conditions:
                  - condition: template
                    value_template: "{{ keypad_code_allowed | bool }}"
                sequence:
                  - action: mqtt.publish
                    data:
                      topic: !input z2m_keypad_path_set
                      qos: 0
                      retain: false
                      payload: >-
                        {{ {'arm_mode': {'transaction': trigger.payload_json.get('action_transaction'), 'mode': trigger.payload_json.get('action')}} | tojson }}

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ keypad_action == 'arm_all_zones' }}"
                        sequence:
                          - action: alarmo.arm
                            target:
                              entity_id: !input control_panel
                            data:
                              mode: away
                              code: "{{ alarm_code_to_use | trim }}"
                            continue_on_error: true
                      - conditions:
                          - condition: template
                            value_template: "{{ keypad_action == 'arm_day_zones' }}"
                        sequence:
                          - action: alarmo.arm
                            target:
                              entity_id: !input control_panel
                            data:
                              mode: home
                              code: "{{ alarm_code_to_use | trim }}"
                            continue_on_error: true
                      - conditions:
                          - condition: template
                            value_template: "{{ keypad_action == 'arm_night_zones' }}"
                        sequence:
                          - action: alarmo.arm
                            target:
                              entity_id: !input control_panel
                            data:
                              mode: night
                              code: "{{ alarm_code_to_use | trim }}"
                            continue_on_error: true
                      - conditions:
                          - condition: template
                            value_template: "{{ keypad_action == 'disarm' }}"
                        sequence:
                          - action: alarmo.disarm
                            target:
                              entity_id: !input control_panel
                            data:
                              code: "{{ alarm_code_to_use | trim }}"
                            continue_on_error: true

                  - wait_template: >-
                      {{ (keypad_action == 'disarm' and states(alarm_entity) == 'disarmed')
                         or (keypad_action == 'arm_all_zones'
                           and (states(alarm_entity) == 'armed_away'
                             or (states(alarm_entity) == 'arming' and state_attr(alarm_entity, 'next_state') == 'armed_away')))
                         or (keypad_action == 'arm_day_zones'
                           and (states(alarm_entity) == 'armed_home'
                             or (states(alarm_entity) == 'arming' and state_attr(alarm_entity, 'next_state') == 'armed_home')))
                         or (keypad_action == 'arm_night_zones'
                           and (states(alarm_entity) == 'armed_night'
                             or (states(alarm_entity) == 'arming' and state_attr(alarm_entity, 'next_state') == 'armed_night'))) }}
                    timeout: "00:00:02"
                    continue_on_timeout: true

                  # Correct the initial acknowledgement if Alarmo could not complete the request.
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: >-
                              {{ keypad_action == 'disarm' and states(alarm_entity) == 'disarmed' }}
                        sequence: []
                      - conditions:
                          - condition: template
                            value_template: >-
                              {{ keypad_action == 'arm_all_zones'
                                 and (states(alarm_entity) == 'armed_away'
                                   or (states(alarm_entity) == 'arming' and state_attr(alarm_entity, 'next_state') == 'armed_away')) }}
                        sequence: []
                      - conditions:
                          - condition: template
                            value_template: >-
                              {{ keypad_action == 'arm_day_zones'
                                 and (states(alarm_entity) == 'armed_home'
                                   or (states(alarm_entity) == 'arming' and state_attr(alarm_entity, 'next_state') == 'armed_home')) }}
                        sequence: []
                      - conditions:
                          - condition: template
                            value_template: >-
                              {{ keypad_action == 'arm_night_zones'
                                 and (states(alarm_entity) == 'armed_night'
                                   or (states(alarm_entity) == 'arming' and state_attr(alarm_entity, 'next_state') == 'armed_night')) }}
                        sequence: []
                    default:
                      - action: mqtt.publish
                        data:
                          topic: !input z2m_keypad_path_set
                          qos: 0
                          retain: false
                          payload: >-
                            {% set response_mode = 'invalid_code' if keypad_action == 'disarm' else 'not_ready' %}
                            {{ {'arm_mode': {'transaction': trigger.payload_json.get('action_transaction'), 'mode': response_mode}} | tojson }}

      # Alarmo -> keypad. Delay/beeping is determined only by Alarmo's actual delay.
      - conditions:
          - condition: trigger
            id: panel_arming
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ state_attr(alarm_entity, 'delay') | int(0) > 0 }}"
                sequence:
                  - action: mqtt.publish
                    data:
                      topic: !input z2m_keypad_path_set
                      qos: 0
                      retain: false
                      payload: >-
                        {{ {'arm_mode': {'mode': 'exit_delay', 'delay': (state_attr(alarm_entity, 'delay') | int(0)), 'audiblenotif': 1}} | tojson }}
            default: []
          - choose:
              default: !input action_arming

      - conditions:
          - condition: trigger
            id: panel_armed_away
        sequence:
          - action: mqtt.publish
            data:
              topic: !input z2m_keypad_path_set
              qos: 0
              retain: false
              payload: '{"arm_mode":{"mode":"arm_all_zones"}}'
          - choose:
              default: !input action_armed_away

      - conditions:
          - condition: trigger
            id: panel_armed_home
        sequence:
          - action: mqtt.publish
            data:
              topic: !input z2m_keypad_path_set
              qos: 0
              retain: false
              payload: '{"arm_mode":{"mode":"arm_day_zones"}}'
          - choose:
              default: !input action_armed_home

      - conditions:
          - condition: trigger
            id: panel_armed_night
        sequence:
          - action: mqtt.publish
            data:
              topic: !input z2m_keypad_path_set
              qos: 0
              retain: false
              payload: '{"arm_mode":{"mode":"arm_night_zones"}}'
          - choose:
              default: !input action_armed_night

      - conditions:
          - condition: trigger
            id: panel_disarmed
        sequence:
          - action: mqtt.publish
            data:
              topic: !input z2m_keypad_path_set
              qos: 0
              retain: false
              payload: '{"arm_mode":{"mode":"disarm"}}'
          - choose:
              default: !input action_disarmed

      - conditions:
          - condition: trigger
            id: panel_pending
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ state_attr(alarm_entity, 'delay') | int(0) > 0 }}"
                sequence:
                  - action: mqtt.publish
                    data:
                      topic: !input z2m_keypad_path_set
                      qos: 0
                      retain: false
                      payload: >-
                        {{ {'arm_mode': {'mode': 'entry_delay', 'delay': (state_attr(alarm_entity, 'delay') | int(0)), 'audiblenotif': 1}} | tojson }}
            default: []
          - choose:
              default: !input action_pending

      - conditions:
          - condition: trigger
            id: panel_triggered
        sequence:
          - action: mqtt.publish
            data:
              topic: !input z2m_keypad_path_set
              qos: 0
              retain: false
              payload: '{"arm_mode":{"mode":"in_alarm","audiblenotif":1}}'
          - choose:
              default: !input action_triggered

    default: []

mode: queued
max: 10
